[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/server.mjs"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/chat-handler.mjs"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/chat.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
